<div class="container">
  <div class="header">
    <h1>Checklist</h1>
    <span class="count" *ngIf="taskArray.length">{{ completedCount }} / {{ taskArray.length }}</span>
  </div>

  <ul class="task-list" *ngIf="taskArray.length; else emptyState">
    <li class="task" *ngFor="let t of taskArray; index as i">
      <label class="task-check">
        <input type="checkbox" [checked]="t.isCompleted" (change)="onCheck(i)" />
        <span class="task-name" [class.completed]="t.isCompleted">{{ t.taskName }}</span>
      </label>
      <button type="button" class="delete-btn" (click)="onDelete(i)" aria-label="Delete task">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </li>
  </ul>

  <ng-template #emptyState>
    <p class="empty">No tasks yet. Add one below.</p>
  </ng-template>

  <form class="add-form" (ngSubmit)="addTask()">
    <input
      type="text"
      class="add-input"
      placeholder="Add a new task"
      [(ngModel)]="newTask"
      name="task"
      autocomplete="off"
    />
    <button type="submit" class="add-btn" [disabled]="!newTask.trim()" aria-label="Add task">
      <i class="fa-solid fa-plus"></i>
    </button>
  </form>
</div>
